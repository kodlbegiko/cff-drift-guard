name: bootstrap issue-121 research files

on:
  push:
    branches:
      - research/issue-121-specificity-validation
    paths:
      - .research-bootstrap/**
      - .github/workflows/bootstrap-issue-121.yml
  pull_request:
    paths:
      - .research-bootstrap/**
      - .github/workflows/bootstrap-issue-121.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue-121-specificity-validation
          fetch-depth: 0
      - name: Decode staged research payload from verified chunks
        run: |
          mkdir -p /tmp/bootstrap-diagnostic
          sha256sum .research-bootstrap/part-* | tee /tmp/bootstrap-diagnostic/part-hashes.txt
          cat .research-bootstrap/part-* | tr -d '\n' > /tmp/issue-121.b64
          sha256sum /tmp/issue-121.b64 | tee /tmp/bootstrap-diagnostic/combined-hash.txt
          base64 --decode /tmp/issue-121.b64 > /tmp/issue-121.tar.gz
          sha256sum /tmp/issue-121.tar.gz | tee /tmp/bootstrap-diagnostic/archive-hash.txt
          gzip -t /tmp/issue-121.tar.gz
      - name: Upload bootstrap diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-bootstrap-diagnostic
          path: /tmp/bootstrap-diagnostic
          if-no-files-found: error
      - name: Materialize non-workflow research payload
        run: |
          tar -xzf /tmp/issue-121.tar.gz
          rm -rf .research-bootstrap
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/issue-121-acquisition.yml
          rm -f .github/workflows/bootstrap-issue-121.yml
          git checkout HEAD -- .github/workflows/bootstrap-issue-121.yml
      - name: Commit research outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "research: publish issue-121 external validation"
          git push origin HEAD:research/issue-121-specificity-validation
