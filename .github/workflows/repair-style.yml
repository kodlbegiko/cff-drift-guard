name: One-time style repair
on:
  push:
    branches:
      - research/cff-version-drift-pilot
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cff-version-drift-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --fix --unsafe-fixes . || true
      - run: ruff format .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: apply ruff formatting and fixes"
            git push origin HEAD:research/cff-version-drift-pilot
          fi
