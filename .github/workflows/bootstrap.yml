name: Bootstrap research repository

on:
  push:
    branches:
      - research/cff-version-drift-pilot
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  expand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cff-version-drift-pilot

      - name: Reconstruct repository payload
        shell: bash
        run: |
          cat \
            .bootstrap/xz-00.txt \
            .bootstrap/xz-01.txt \
            .bootstrap/xz-02.txt \
            .bootstrap/xz-03.txt \
            .bootstrap/xz-04.txt \
            .bootstrap/xz-05a.txt \
            .bootstrap/xz-05b.txt \
            .bootstrap/xz-05c.txt \
            .bootstrap/xz-05d.txt \
            .bootstrap/xz-06.txt \
            .bootstrap/xz-07.txt \
            .bootstrap/xz-08.txt \
            .bootstrap/xz-09.txt \
            .bootstrap/xz-10.txt \
            .bootstrap/xz-11.txt \
            | base64 --decode > /tmp/repo.tar.xz
          echo "1e8123df6816e272308baf0a1a60ed6a53f273c97e8b5671030ff8345a71f452  /tmp/repo.tar.xz" | sha256sum --check -
          tar -xJf /tmp/repo.tar.xz
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Use actionable type-checking policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'strict = true\nfiles = ["src"]',
              'check_untyped_defs = true\ndisallow_untyped_defs = true\nwarn_unused_ignores = true\nwarn_redundant_casts = true\nno_implicit_optional = true\nfiles = ["src"]',
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit expanded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish reproducible CFF drift pilot"
          git push origin HEAD:research/cff-version-drift-pilot
