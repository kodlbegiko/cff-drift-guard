name: One-time ruff diagnostics
on:
  push:
    branches:
      - research/cff-version-drift-pilot
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cff-version-drift-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: |
          ruff check . --output-format=concise > docs/ruff-diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ruff-diagnostics.txt
          git commit -m "chore: capture ruff diagnostics"
          git push origin HEAD:research/cff-version-drift-pilot
