name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        id: ruff
        continue-on-error: true
        run: ruff check . --output-format=concise | tee /tmp/ruff-check.txt
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-check-${{ matrix.python-version }}
          path: /tmp/ruff-check.txt
          if-no-files-found: error
      - name: Enforce Ruff check
        if: steps.ruff.outcome != 'success'
        run: exit 1
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build
      - run: PYTHONHASHSEED=0 cff-drift-guard benchmark --output-dir /tmp/results-a
      - run: PYTHONHASHSEED=321 cff-drift-guard benchmark --output-dir /tmp/results-b
      - run: diff -u /tmp/results-a/pilot-results-deterministic.json /tmp/results-b/pilot-results-deterministic.json
      - run: >-
          PYTHONHASHSEED=0 python scripts/evaluate_issue_121_specificity.py
          --acquisition data/issue-121/acquisition-deterministic.json
          --adjudications data/issue-121/adjudications.json
          --output-dir /tmp/issue121-a
      - run: >-
          PYTHONHASHSEED=321 python scripts/evaluate_issue_121_specificity.py
          --acquisition data/issue-121/acquisition-deterministic.json
          --adjudications data/issue-121/adjudications.json
          --output-dir /tmp/issue121-b
      - run: diff -u /tmp/issue121-a/external-validation-results.json /tmp/issue121-b/external-validation-results.json
