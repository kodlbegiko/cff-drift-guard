name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build
      - run: PYTHONHASHSEED=0 cff-drift-guard benchmark --output-dir /tmp/results-a
      - run: PYTHONHASHSEED=321 cff-drift-guard benchmark --output-dir /tmp/results-b
      - run: diff -u /tmp/results-a/pilot-results-deterministic.json /tmp/results-b/pilot-results-deterministic.json
